name: development

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3'

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - run: pip install pre-commit

      - run: pre-commit run --all-files

      - run: npm install -g yarn && yarn

      - run: yarn run lint

      - run: yarn run typecheck

  run-tests:
    # Login e2e tests share one email inbox + S3 distributed lock in the dev
    # environment. Two runs racing for that lock exceed the lock wait (60s)
    # in the middle of a single 50s test timeout, so a run that has to wait
    # always fails outright rather than just running slower. Serialize CI
    # runs so only one ever holds the lock at a time (dependabot can push
    # several branches back-to-back, e.g. its weekly batch).
    concurrency:
      group: e2e-dev-login
      cancel-in-progress: false
    uses: trade-tariff/trade-tariff-tools/.github/workflows/e2e-fpo-tests.yml@main
    with:
      test-environment: development
      ref: ${{ github.ref }}
